[package]
name = "photocraft-frameforge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
photocraft-engine.workspace = true
photocraft-text.workspace = true
serde_json.workspace = true
flate2.workspace = true
crc32fast = "1"
# WOFF2 → sfnt for the fonts the FrameForge server serves (pure Rust, MIT).
wuff = { version = "0.2", default-features = false, features = ["brotli"] }

[dev-dependencies]
photocraft-io.workspace = true
image = { workspace = true, features = ["png"] }
