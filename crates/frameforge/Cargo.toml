[package]
name = "photocraft-frameforge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# `photocraft_frameforge::testing` (synthetic archives and fonts) for other crates' tests. Off by
# default, so release builds (desktop and wasm) never compile it; enable it only from
# `[dev-dependencies]` (photocraft-ui-egui does).
testing = []

[dependencies]
photocraft-engine.workspace = true
photocraft-text.workspace = true
# Crash-safe writes for `font_store` (the desktop's converted-font cache).
photocraft-format.workspace = true
serde_json.workspace = true
flate2.workspace = true
crc32fast = "1"
# WOFF2 → sfnt for the fonts the FrameForge server serves (pure Rust, MIT).
wuff = { version = "0.2", default-features = false, features = ["brotli"] }

[dev-dependencies]
photocraft-io.workspace = true
image = { workspace = true, features = ["png"] }
