# Fork-only (ViewHook/photocraft): builds an unsigned x64 Windows package (MSI + portable zip) with
# the same package.ps1 as release.yml's Windows job, minus its release environment, secrets and release.
# Download it from the Actions run's Artifacts: photocraft-windows-x64-<sha> (PR head on PRs), 14 days.
# It is unsigned, so Windows SmartScreen warns on first launch (More info, then Run anyway).
name: Windows artifact

# Every push to main, manual runs, and PRs that change this workflow, the Windows packaging, the
# desktop app, the FrameForge or egui UI crates, or the lockfile.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/windows-artifact.yml
      - packaging/windows/**
      - apps/photocraft/**
      - crates/frameforge/**
      - crates/ui-egui/**
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

# As in ci.yml: a newer push to a PR branch cancels its older run; runs on main are never cancelled.
concurrency:
  group: windows-artifact-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # The PR head commit on PRs (github.sha is the merge commit there), so the About box matches the
  # artifact name.
  PHOTOCRAFT_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # Same craft-fonts commit as release.yml (CRAFT_FONTS_REF) and ci.yml; bump them together.
  CRAFT_FONTS_REF: abb83316d96aa59c1cf64784289e378fe9fa5695

jobs:
  windows-x64:
    name: Windows x64 (unsigned)
    runs-on: windows-latest
    # No `environment:` and no secrets: nothing here signs or publishes.
    timeout-minutes: 90
    steps:
      # On PRs build the PR head itself (not the merge into main), so the code matches the name.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out craft-fonts (embedded fonts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      # Only main saves the cache; PRs restore main's (keeps the repo's 10 GB cache budget for main).
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-artifact-x64
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # photocraft.wxs uses only the core WiX v4 schema, so no `wix extension add` is needed.
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      # No WINDOWS_CERTIFICATE / AZURE_* variables are set, so sign.ps1 prints a warning and leaves
      # the binaries and the MSI unsigned (exit code 0), as windows-arm64.yml relies on.
      - name: Build and package (unsigned)
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
